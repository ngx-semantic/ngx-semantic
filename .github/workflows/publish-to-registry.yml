name: Publish to Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v2.0.7-beta.2)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1
      - name: Derive version from tag
        id: meta
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          V="${TAG#v}"
          echo "Tag: $TAG"
          echo "Version: $V"

          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag $TAG does not contain a valid semver version"
            exit 1
          fi

          L=$(printf '%s' "$V" | tr '[:upper:]' '[:lower:]')
          PRE=false
          NPM_TAG=latest
          if echo "$L" | grep -qE -- '-alpha([.-]|$)'; then
            PRE=true
            NPM_TAG=alpha
          elif echo "$L" | grep -qE -- '-beta([.-]|$)'; then
            PRE=true
            NPM_TAG=beta
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Apply version from tag
        run: node .github/scripts/set-version.mjs "${{ steps.meta.outputs.version }}"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run Tests
        run: npm run test:ci
      - name: Build
        run: npm run build:prod
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: ./dist
          retention-days: 1

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.tag }}
          fetch-depth: 1
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ./dist
      - name: Publish Lib
        run: npm publish ./dist --provenance --tag ${{ needs.quality.outputs.npm_tag }} --access public

  sync-version:
    needs: [quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Apply version from tag
        run: node .github/scripts/set-version.mjs "${{ needs.quality.outputs.version }}"
      - name: Commit version to master
        env:
          TAG: ${{ needs.quality.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "master is already at ${{ needs.quality.outputs.version }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/package.json package-lock.json
          git commit -m "chore(release): $TAG"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing on master"
            git pull --rebase origin master
          done

          echo "Could not push the release commit to master"
          exit 1

  release:
    needs: [quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.quality.outputs.tag }}
          fetch-depth: 1
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.quality.outputs.tag }}
          prerelease: ${{ needs.quality.outputs.prerelease == 'true' }}
          makeLatest: ${{ needs.quality.outputs.prerelease != 'true' }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
