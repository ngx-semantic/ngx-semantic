name: Publish to Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v2.0.7-beta.2)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1
      - name: Verify tag matches src/package.json
        id: meta
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          CURR_VERSION=$(python3 -c "import json; print(json.load(open('src/package.json'))['version'])")
          EXPECTED="v${CURR_VERSION}"
          echo "Lib version: $CURR_VERSION"
          echo "Tag: $TAG"

          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match src/package.json version $CURR_VERSION (expected $EXPECTED)"
            exit 1
          fi

          V="${TAG#v}"
          L=$(printf '%s' "$V" | tr '[:upper:]' '[:lower:]')
          PRE=false
          NPM_TAG=latest
          if echo "$L" | grep -qE -- '-alpha([.-]|$)'; then
            PRE=true
            NPM_TAG=alpha
          elif echo "$L" | grep -qE -- '-beta([.-]|$)'; then
            PRE=true
            NPM_TAG=beta
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run Tests
        run: npm run test:ci
      - name: Build
        run: npm run build:prod
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: ./dist
          retention-days: 1

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.tag }}
          fetch-depth: 1
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ./dist
      - name: Publish Lib
        run: npm publish ./dist --provenance --tag ${{ needs.quality.outputs.npm_tag }} --access public

  release:
    needs: [quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.tag }}
          fetch-depth: 1
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.quality.outputs.tag }}
          prerelease: ${{ needs.quality.outputs.prerelease == 'true' }}
          makeLatest: ${{ needs.quality.outputs.prerelease != 'true' }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
